[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2word-agent"
version = "1.0.0"
description = "Local-first PDF to editable Word reconstruction pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Raelon" }]
dependencies = [
  "pydantic>=2",
  "pdfplumber>=0.11",
  "pypdfium2>=4",
  "python-docx>=1.1",
  "Pillow>=10"
]

[project.optional-dependencies]
gui = ["PySide6>=6.7"]

[project.scripts]
pdf2word = "pdf2word.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
