[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2word-agent"
version = "1.0.0"
description = "Local-first PDF to editable Word reconstruction pipeline."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Raelon" }]
# Pinned for v1.0.0-mvp reproducibility (see requirements.txt).
dependencies = [
  "pydantic==2.13.4",
  "pdfplumber==0.11.10",
  "pypdfium2==5.12.1",
  "python-docx==1.2.0",
  "Pillow==12.3.0",
  "lxml==6.1.1",
]

[project.optional-dependencies]
gui = [
  "PySide6==6.11.1",
]

[project.scripts]
pdf2word = "pdf2word.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
